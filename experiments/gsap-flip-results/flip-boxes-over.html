<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Experiment – GSAP FLIP</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="wrap">
    <div class="grid" id="grid">
      <div class="tile" tabindex="0" data-title="Responsiveness"
        data-text="Low latency mapping of movement to parameters." data-grade="S"></div>
      <div class="tile" tabindex="0" data-title="Intuitiveness" data-text="Gestures are discoverable and feel natural."
        data-grade="A"></div>
      <div class="tile" tabindex="0" data-title="Visual Smoothness" data-text="Stable, stutter-free motion visuals."
        data-grade="B"></div>
      <div class="tile" tabindex="0" data-title="Engagement" data-text="Invites experimentation; clear agency."
        data-grade="A"></div>
      <div class="tile" tabindex="0" data-title="Feedback Clarity" data-text="Cues clearly confirm recognition."
        data-grade="B"></div>
      <div class="tile" tabindex="0" data-title="ML5 Model Stability"
        data-text="Consistent keypoints; minor jitter at speed." data-grade="C"></div>
    </div>

  </div>

  <script>
    gsap.registerPlugin(Flip);
    const grid = document.getElementById("grid");

    function hydrate(el) {
      const t = el.dataset.title;
      const d = el.dataset.text;
      const g = (el.dataset.grade || "B").toUpperCase();
      el.innerHTML = `
        <div class="preview" aria-hidden="false">
          <div class="title">${t}</div>
          <div class="grade ${g}" aria-label="grade ${g}">${g}</div>
        </div>
        <div class="details" aria-hidden="true">
          <div class="head">
            <span class="chip ${g}" aria-label="grade ${g}">${g}</span>
            <div class="ttl">${t}</div>
          </div>
          <p class="desc">${d}</p>
        </div>
      `;
    }
    [...grid.children].forEach(hydrate);

    let active = null;

    function flipWith(mut) {
      const tiles = [...grid.children];
      const state = Flip.getState(tiles);
      mut();
      Flip.from(state, {
        duration: .45,
        ease: "power2.inOut",
        absolute: true,
        scale: false,
        stagger: .012
      });
    }

    function openTile(tile) {
      if (active === tile) { closeActive(); return; }
      flipWith(() => {
        if (active) active.classList.remove("is-localwide", "show-details");
        tile.classList.add("is-localwide");
      });

      gsap.delayedCall(0.46, () => tile.classList.add("show-details"));
      active = tile;
    }

    function closeActive() {
      if (!active) return;
      const t = active;
      flipWith(() => t.classList.remove("is-localwide", "show-details"));
      active = null;
    }

    grid.addEventListener("click", e => {
      const t = e.target.closest(".tile"); if (!t) return;
      openTile(t);
    });

    grid.addEventListener("keydown", e => {
      const t = e.target.closest(".tile"); if (!t) return;
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openTile(t); }
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeActive();
    });
  </script>
</body>

</html>

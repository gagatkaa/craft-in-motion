<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tickets-simple</title>



    <style>
        :root {
            --bg: #0e0f13;
            --ink: #e6e8ef;
            --muted: #9aa1b6;
            --ticket: #1e2434;
            --line: #2a3146;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, sans-serif;
        }

        .spacer {
            height: 120vh;
            display: grid;
            place-items: center;
            color: var(--muted);
        }

        .cta {
            min-height: 100vh;
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
        }

        .cta__inner {
            text-align: center;
            max-width: 900px;
            padding: 2rem;
        }

        .tickets {
            margin-top: 2rem;
            display: grid;
            grid-template-columns: repeat(3, 160px);
            gap: 16px 20px;
            justify-content: center;
            align-content: center;
            min-height: 380px;
            position: relative;
        }

        .ticket {
            width: 160px;
            height: 110px;
            background: var(--ticket);
            border: 1px solid var(--line);
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-weight: 600;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
            transform: translateY(-120vh);
            opacity: 0;
            will-change: transform, opacity;
        }
    </style>
</head>

<body>
    <div class="spacer">Scroll down to the CTA</div>

    <section class="cta" id="cta">
        <div class="cta__inner">
            <h2>Are you ready to keep the rhythm?</h2>
            <p class="muted">We’ll pause here. Tickets drop from above, then you can scroll on.</p>

            <div class="tickets" id="tickets">
                <div class="ticket">#1001<br />2x Burger</div>
                <div class="ticket">#1002<br />Latte</div>
                <div class="ticket">#1003<br />Soup + Bread</div>
                <div class="ticket">#1004<br />Pasta</div>
                <div class="ticket">#1005<br />Tacos</div>
                <div class="ticket">#1006<br />Salad</div>
                <div class="ticket">#1007<br />Tea</div>
                <div class="ticket">#1008<br />Fries</div>
                <div class="ticket">#1009<br />Soda</div>
            </div>
        </div>
    </section>

    <div class="spacer">You’re free to continue</div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script>
        gsap.registerPlugin(ScrollTrigger);

        const tickets = gsap.utils.toArray(".ticket");

        const tl = gsap.timeline({
            defaults: { ease: "power2.out" }
        });

        tl.to(tickets, {
            y: 0,
            opacity: 1,
            duration: 0.9,
            stagger: { each: 0.12 }
        });

        tl.to(tickets, {
            y: "+=6",
            duration: 0.2
        }).to(tickets, {
            y: "-=6",
            duration: 0.25
        });

        ScrollTrigger.create({
            trigger: "#cta",
            start: "top top",
            end: "+=1400",
            pin: true,
            scrub: true,
            animation: tl,
            // markers: true          
        });


    </script>
</body>

</html>

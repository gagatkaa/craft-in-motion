<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>ML5 → Particles Integration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            background: #0f1116;
            color: #e9eef3;
            font-family: system-ui, sans-serif;
        }

        .wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            height: 100vh;
            padding: 8px;
            box-sizing: border-box;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 1px solid #223045;
            border-radius: 10px;
            background: #0d1219;
        }

        .legend {
            position: fixed;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            opacity: .7;
        }
    </style>
</head>

<body>
    <div class="legend">Left: PoseNet tempo • Right: Particles. Shake → particles react.</div>
    <div class="wrap">
        <!-- adjust paths if your structure differs -->
        <iframe id="ml" src="../ml5-posenet-tempo/index.html" title="PoseNet"></iframe>
        <iframe id="viz" src="../particles-mapping/index.html" title="Particles"></iframe>
    </div>

    <script>
        const ml = document.getElementById('ml');
        const viz = document.getElementById('viz');

        // Receive tempo from the ML iframe and forward it to the particles iframe
        window.addEventListener('message', (e) => {
            if (e.source === ml.contentWindow && e.data && e.data.type === 'ml:tempo') {
                // forward as-is
                viz.contentWindow.postMessage(e.data, '*');
            }
        });
    </script>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>GSAP MorphSVG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            margin: 0;
            background: #0f1012;
            height: 100vh;
            display: grid;
            place-items: center;
        }

        svg {
            width: 150px;
            height: auto;
            cursor: pointer;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MorphSVGPlugin.min.js"></script>
</head>

<body>

    <svg viewBox="0 0 82 251" aria-label="Mini morph circle to shaker">

        <path id="circle" fill="#D37624" d="M41,100 a20,20 0 1,0 0,40 a20,20 0 1,0 0,-40" />

        <g id="shakerFill" transform="scale(0.3) translate(90,170)">
            <path id="shakerPath" fill="#34d399" visibility="hidden"
                d="M9.88916 99.6519L17.8889 11.0732C17.8889 7.90652 19.0889 1.57319 23.8889 1.57319H54.3889C57.0556 1.23986 62.4889 1.87319 62.8889 7.07319C62.9363 7.69 63.0358 9.07119 63.1794 11.0732C64.2461 25.9491 67.745 75.1017 70.3892 99.6336H70.389C75.2078 99.7442 78.3964 99.8907 78.8889 100.073C81.3892 101 78.8889 155.573 78.8889 155.573L68.8889 241.573C68.8889 244.073 68.1889 249.073 65.3889 249.073H16.3889C15.2222 248.907 12.7889 247.173 12.3889 241.573C11.9889 235.973 5.55556 181.907 2.38889 155.573C2.38889 155.573 0.388889 101 2.38889 100.073C2.76137 99.9007 5.56185 99.7602 9.88916 99.6519Z" />
        </g>

    </svg>

    <script>
        gsap.registerPlugin(MorphSVGPlugin);

        const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.inOut" } });

        tl.to("#circle", { duration: 1.0, morphSVG: "#shakerPath" })

        let open = false;
        document.querySelector("svg").addEventListener("click", () => {
            open ? tl.reverse() : tl.play(0);
            open = !open;
        });
    </script>
</body>

</html>

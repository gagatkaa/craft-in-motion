<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>ml5 PoseNet Tempo Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- TensorFlow.js and ml5 -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
    <link rel="stylesheet" href="./style.css" />
</head>

<body>
    <main>
        <h1>PoseNet Tempo</h1>

        <section class="stage">
            <video id="video" playsinline autoplay muted></video>
            <canvas id="overlay"></canvas>
            <div class="hud">
                <div><strong>FPS:</strong> <span id="fps">0</span></div>
                <div><strong>Elbow angle:</strong> <span id="angle">0</span> deg</div>
                <div><strong>Tempo:</strong> <span id="tempo">0.0</span> Hz</div>
                <div><strong>Consistency:</strong> <span id="consistency">0.00</span> s SD</div>
                <div><strong>Using point:</strong> <span id="point">wrist</span></div>
                <div class="note">Tip: stand about 1.8 m from camera, raise your arms and shake like a cocktail. If the
                    wrist is occluded, the demo will fall back to tracking elbow.</div>
            </div>
        </section>

        <section class="controls">
            <label>Input size
                <select id="inputSize">
                    <option>320</option>
                    <option selected>480</option>
                    <option>640</option>
                </select>
            </label>
            <label>Smoothing
                <input id="smoothing" type="range" min="0" max="0.9" step="0.05" value="0.3" />
                <span id="smoothingVal">0.30</span>
            </label>
            <label>Peak threshold
                <input id="peak" type="range" min="2" max="30" step="1" value="8" />
                <span id="peakVal">8</span>
            </label>
        </section>
    </main>

    <script src="./script.js"></script>
</body>

</html>

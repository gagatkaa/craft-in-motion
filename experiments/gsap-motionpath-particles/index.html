<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>ML signal → particles</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="ui">
        <label>Tempo (Hz) simulated ML signal: <span id="tempoVal">2.0</span></label>
        <input id="tempo" type="range" min="0" max="6" step="0.1" value="2" />
        <div class="hint">
            Mapping example:<br />
            higher tempo → more particles, bigger size, shorter lifetime, brighter glow
        </div>
    </div>
    <canvas id="c"></canvas>

    <script src="script.js"></script>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ML5 Interaction – Assessment (GSAP Flip)</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Flip.min.js"></script>
  <style>
    :root {
      --bg: #0f1012;
      --tile: #1b1e24;
      --tile2: #242833;
      --bd: #2b2f3a;
      --fg: #e8e8ea;
      --muted: #a7abbb;
      --accent: #67d4ff;
      /* kolory ocen */
      --gS: #53e88f;
      --gA: #8fd9ff;
      --gB: #f1d36d;
      --gC: #ff9b6a;
      --gF: #ff6b6b;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      min-height: 100svh;
      display: grid;
      place-items: center;
    }

    .wrap {
      width: min(960px, 92vw)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px
    }

    .tile {
      background: linear-gradient(135deg, var(--tile), var(--tile2));
      border: 1px solid var(--bd);
      border-radius: 12px;
      cursor: pointer;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .25s ease;
    }

    .tile:hover {
      background: linear-gradient(135deg, var(--tile2), #303546)
    }

    /* układ zawartości kafla w podglądzie */
    .tile__inner {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: .4rem;
    }

    .title {
      font-size: 1rem;
      color: #e6e9f4;
      font-weight: 700
    }

    .subtitle {
      font-size: .9rem;
      color: var(--muted)
    }

    .grade {
      font-weight: 900;
      line-height: 1;
      font-size: 3.2rem;
      margin: .2rem 0 .1rem;
      letter-spacing: .05em;
      filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .25));
    }

    .grade.S {
      color: var(--gS)
    }

    .grade.A {
      color: var(--gA)
    }

    .grade.B {
      color: var(--gB)
    }

    .grade.C {
      color: var(--gC)
    }

    .grade.F {
      color: var(--gF)
    }

    /* stan rozwinięty na górze */
    .tile.is-wide {
      grid-column: 1 / -1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      text-align: left;
      padding: 1.2rem 1.4rem;
    }

    .tile.is-wide .expanded {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: .6rem;
    }

    .tile.is-wide .expanded .head {
      display: flex;
      align-items: center;
      gap: .75rem;
    }

    .chip {
      display: inline-grid;
      place-items: center;
      min-width: 34px;
      height: 28px;
      padding: 0 .55rem;
      font-weight: 800;
      border-radius: 8px;
      border: 1px solid #3a3e4b;
      background: #1f2330;
    }

    .chip.S {
      color: var(--gS)
    }

    .chip.A {
      color: var(--gA)
    }

    .chip.B {
      color: var(--gB)
    }

    .chip.C {
      color: var(--gC)
    }

    .chip.F {
      color: var(--gF)
    }

    .expanded .title {
      font-size: 1.2rem;
      color: var(--accent)
    }

    .desc {
      margin: 0;
      font-size: .98rem;
      opacity: .9
    }

    .hint {
      opacity: .65;
      margin: 18px 2px 0;
      text-align: center;
      font-size: 14px
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="grid" id="grid">
      <div class="tile" tabindex="0" data-title="Responsiveness"
        data-text="System reacts to user motion with minimal latency. Movements reliably modulate animation parameters."
        data-grade="S"></div>

      <div class="tile" tabindex="0" data-title="Intuitiveness"
        data-text="Users quickly understand how gestures affect the outcome. Controls feel natural and discoverable."
        data-grade="A"></div>

      <div class="tile" tabindex="0" data-title="Visual Smoothness"
        data-text="Animations are stable and stutter free. Camera and keypoint visuals remain coherent during motion."
        data-grade="B"></div>

      <div class="tile" tabindex="0" data-title="Engagement"
        data-text="Strong sense of agency. The interaction invites experimentation and sustains interest."
        data-grade="A"></div>

      <div class="tile" tabindex="0" data-title="Feedback Clarity"
        data-text="Visual cues confirm recognition, such as color or intensity changes mapping clearly to input."
        data-grade="B"></div>

      <div class="tile" tabindex="0" data-title="ML5 Model Stability"
        data-text="Pose detection remains consistent across distances. Minor jitter under fast motion." data-grade="C">
      </div>
    </div>

    <p class="hint">Click a card to expand to the top. Click again or press Esc to reset.</p>
  </div>

  <script>
    gsap.registerPlugin(Flip);
    const grid = document.getElementById("grid");

    function renderCollapsed(el) {
      const t = el.dataset.title;
      const g = (el.dataset.grade || "B").toUpperCase();
      el.innerHTML = `
      <div class="tile__inner">
        <div class="title">${t}</div>
        <div class="grade ${g}" aria-label="grade ${g}">${g}</div>
        <div class="subtitle">Click to read</div>
      </div>
    `;
    }

    function renderExpanded(el) {
      const t = el.dataset.title;
      const d = el.dataset.text;
      const g = (el.dataset.grade || "B").toUpperCase();
      el.innerHTML = `
      <div class="expanded">
        <div class="head">
          <span class="chip ${g}" aria-label="grade ${g}">${g}</span>
          <div class="title">${t}</div>
        </div>
        <p class="desc">${d}</p>
      </div>
    `;
    }

    // init
    [...grid.children].forEach(renderCollapsed);

    function expandToTop(tile) {
      const tiles = [...grid.children];
      const state = Flip.getState(tiles);
      tiles.forEach(t => { t.classList.remove("is-wide"); renderCollapsed(t); });

      grid.insertBefore(tile, grid.firstChild);
      tile.classList.add("is-wide");
      renderExpanded(tile);

      Flip.from(state, { duration: .55, ease: "power2.inOut", stagger: .015, scale: true });
    }

    function resetAll() {
      const tiles = [...grid.children];
      const state = Flip.getState(tiles);
      tiles.forEach(t => { t.classList.remove("is-wide"); renderCollapsed(t); });
      Flip.from(state, { duration: .45, ease: "power2.out", scale: true });
    }

    grid.addEventListener("click", e => {
      const t = e.target.closest(".tile"); if (!t) return;
      if (t.classList.contains("is-wide")) resetAll();
      else expandToTop(t);
    });

    grid.addEventListener("keydown", e => {
      const t = e.target.closest(".tile"); if (!t) return;
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); expandToTop(t); }
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") resetAll();
    });
  </script>
</body>

</html>
